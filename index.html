<xml>
  <components>
    <iframe srcdoc='<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>SSP Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <div id="app" class="max-w-md mx-auto min-h-screen flex flex-col pb-28 pt-4 px-4"></div>

  <script>
    let currentDate = new Date();
    let activeTab = "calendar";
    let showOffDutyOnGrid = true;
    
    let staff = JSON.parse(localStorage.getItem("ssp_staff")) || [
      { id: "1", name: "Иван Иванов", weeklyLimit: 40, hourlyRate: 15 },
      { id: "2", name: "Анна Смирнова", weeklyLimit: 35, hourlyRate: 16 }
    ];

    let requirements = JSON.parse(localStorage.getItem("ssp_reqs")) || { morning: 2, evening: 1 };
    let shifts = JSON.parse(localStorage.getItem("ssp_shifts")) || {};
    let selectedDateStr = null;

    function saveData() {
      localStorage.setItem("ssp_staff", JSON.stringify(staff));
      localStorage.setItem("ssp_reqs", JSON.stringify(requirements));
      localStorage.setItem("ssp_shifts", JSON.stringify(shifts));
    }

    function getStaffMonthlyHours() {
      const hours = {};
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      Object.entries(shifts).forEach(([dateStr, dayShifts]) => {
        const [dYear, dMonth] = dateStr.split("-").map(Number);
        if (dYear === year && (dMonth - 1) === month) {
          ["morning", "evening"].forEach(sType => {
            (dayShifts[sType] || []).forEach(empId => {
              hours[empId] = (hours[empId] || 0) + 8;
            });
          });
        }
      });
      return hours;
    }

    function getConflicts() {
      const newConflicts = [];
      const staffHours = getStaffMonthlyHours();

      Object.entries(shifts).forEach(([dateStr, dayShifts]) => {
        ["morning", "evening"].forEach(shiftType => {
          const assigned = dayShifts[shiftType] || [];
          const req = requirements[shiftType] || 0;
          if (req > 0 && assigned.length < req) {
            const shiftName = shiftType === "morning" ? "Утро" : "Вечер";
            newConflicts.push(`${dateStr}: Нехватка на смене "${shiftName}" (требуется ${req}, назначено ${assigned.length})`);
          }
        });
      });

      staff.forEach(emp => {
        const workedHours = staffHours[emp.id] || 0;
        const monthlyLimit = emp.weeklyLimit * 4;
        if (workedHours > monthlyLimit) {
          newConflicts.push(`${emp.name}: Превышен лимит (${workedHours}ч / ${monthlyLimit}ч в месяц)`);
        }
      });

      return newConflicts;
    }

    function render() {
      saveData();
      const app = document.getElementById("app");
      
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      
      let startingDay = firstDay.getDay() - 1;
      if (startingDay === -1) startingDay = 6;

      const days = [];
      for (let i = 0; i < startingDay; i++) days.push(null);
      for (let i = 1; i <= lastDay.getDate(); i++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(i).padStart(2, "0")}`;
        days.push({ dayNumber: i, dateStr });
      }

      let totalCost = 0;
      Object.values(shifts).forEach(dayShifts => {
        ["morning", "evening"].forEach(sType => {
          (dayShifts[sType] || []).forEach(empId => {
            const emp = staff.find(s => s.id === empId);
            if (emp) totalCost += emp.hourlyRate * 8;
          });
        });
      });

      const conflicts = getConflicts();
      const staffHours = getStaffMonthlyHours();

      let content = `
        <header class="flex justify-between items-center py-3 border-b border-slate-800/80 mb-4 backdrop-blur-md sticky top-0 bg-slate-950/80 z-30">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xl">📅</span>
              <h1 class="text-xl font-black tracking-tight text-blue-400">SSP Calendar</h1>
            </div>
            <p class="text-[11px] font-medium text-slate-400">Управление сменами iOS</p>
          </div>
          <div class="text-right bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-2xl">
            <div class="text-[10px] uppercase font-semibold text-slate-400">ФОТ Месяца</div>
            <div class="text-base font-extrabold text-emerald-400">€${totalCost.toLocaleString()}</div>
          </div>
        </header>
      `;

      if (conflicts.length > 0 && activeTab === "calendar") {
        content += `
          <div class="mb-4 bg-amber-500/10 border border-amber-500/20 rounded-2xl p-3 text-xs text-amber-300">
            <div class="font-bold flex items-center gap-1.5 mb-1 text-amber-400"><span>⚠️</span> Замечания (${conflicts.length}):</div>
            <ul class="space-y-1 max-h-20 overflow-y-auto text-[11px] pl-1">
              ${conflicts.map(c => `<li>• ${c}</li>`).join("")}
            </ul>
          </div>
        `;
      }

      if (activeTab === "calendar") {
        const monthName = currentDate.toLocaleString("ru", { month: "long", year: "numeric" });
        content += `
          <main class="space-y-3">
            <div class="flex items-center justify-between bg-slate-900/80 border border-slate-800 rounded-2xl p-1.5">
              <button onclick="changeMonth(-1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 rounded-xl font-bold">‹</button>
              <span class="font-bold text-sm text-slate-200 capitalize">${monthName}</span>
              <button onclick="changeMonth(1)" class="w-9 h-9 flex items-center justify-center bg-slate-800 rounded-xl font-bold">›</button>
            </div>

            <div class="flex justify-between items-center px-1">
              <span class="text-[11px] text-slate-400">Календарь</span>
              <button onclick="toggleOffDutyGrid()" class="text-[11px] font-semibold text-blue-400 bg-blue-500/10 px-2.5 py-1 rounded-xl border border-blue-500/20">
                ${showOffDutyOnGrid ? "☕ Выходные: Видны" : "☕ Выходные: Скрыты"}
              </button>
            </div>

            <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-500 py-1">
              <span>ПН</span><span>ВТ</span><span>СР</span><span>ЧТ</span><span>ПТ</span><span>СБ</span><span>ВC</span>
            </div>

            <div class="grid grid-cols-7 gap-1.5">
              ${days.map(d => {
                if (!d) return `<div class="h-24 rounded-2xl bg-slate-900/20"></div>`;
                const dayShift = shifts[d.dateStr] || { morning: [], evening: [] };
                const morningCount = (dayShift.morning || []).length;
                const eveningCount = (dayShift.evening || []).length;
                const reqM = requirements.morning || 0;
                const reqE = requirements.evening || 0;
                const hasIssue = (reqM > 0 && morningCount < reqM) || (reqE > 0 && eveningCount < reqE);

                const workingIds = [...(dayShift.morning || []), ...(dayShift.evening || [])];
                const offStaff = staff.filter(s => !workingIds.includes(s.id));

                return `
                  <div onclick="selectDate('${d.dateStr}')" class="h-24 bg-slate-900/60 border ${hasIssue ? "border-amber-500/40 bg-amber-500/5" : "border-slate-800"} rounded-2xl p-1.5 flex flex-col justify-between cursor-pointer active:scale-95 transition">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-black ${hasIssue ? "text-amber-400" : "text-slate-200"}">${d.dayNumber}</span>
                      ${hasIssue ? `<span class="text-[9px]">⚠️</span>` : ""}
                    </div>
                    <div class="space-y-1 my-auto">
                      ${reqM > 0 ? `<div class="text-[9px] px-1 py-0.5 rounded flex justify-between ${morningCount >= reqM ? "bg-amber-500/15 text-amber-300" : "bg-red-500/15 text-red-300"}"><span>Утр</span><b>${morningCount}/${reqM}</b></div>` : ""}
                      ${reqE > 0 ? `<div class="text-[9px] px-1 py-0.5 rounded flex justify-between ${eveningCount >= reqE ? "bg-indigo-500/15 text-indigo-300" : "bg-red-500/15 text-red-300"}"><span>Веч</span><b>${eveningCount}/${reqE}</b></div>` : ""}
                    </div>
                    ${showOffDutyOnGrid ? `<div class="text-[8px] text-slate-400 truncate bg-slate-950 px-1 py-0.5 rounded">☕ ${offStaff.length ? offStaff.map(s => s.name.split(" ")[0]).join(", ") : "Никого"}</div>` : ""}
                  </div>
                `;
              }).join("")}
            </div>
          </main>
        `;
      } else if (activeTab === "staff") {
        content += `
          <main class="space-y-4">
            <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-4 space-y-3">
              <h3 class="font-bold text-sm">Требования к сменам</h3>
              <div class="grid grid-cols-2 gap-3">
                <div class="bg-slate-950 p-3 rounded-2xl text-center">
                  <label class="text-[11px] text-amber-300 block mb-1">Утро</label>
                  <div class="flex justify-center gap-2 items-center">
                    <button onclick="updateReq('morning', Math.max(0, requirements.morning - 1))" class="w-8 h-8 bg-slate-800 rounded-xl font-bold">-</button>
                    <span class="font-extrabold">${requirements.morning}</span>
                    <button onclick="updateReq('morning', requirements.morning + 1)" class="w-8 h-8 bg-slate-800 rounded-xl font-bold">+</button>
                  </div>
                </div>
                <div class="bg-slate-950 p-3 rounded-2xl text-center">
                  <label class="text-[11px] text-indigo-300 block mb-1">Вечер</label>
                  <div class="flex justify-center gap-2 items-center">
                    <button onclick="updateReq('evening', Math.max(0, requirements.evening - 1))" class="w-8 h-8 bg-slate-800 rounded-xl font-bold">-</button>
                    <span class="font-extrabold">${requirements.evening}</span>
                    <button onclick="updateReq('evening', requirements.evening + 1)" class="w-8 h-8 bg-slate-800 rounded-xl font-bold">+</button>
                  </div>
                </div>
              </div>
            </div>

            <div class="space-y-3">
              <div class="flex justify-between items-center px-1">
                <h3 class="font-bold text-sm">Персонал</h3>
                <button onclick="addStaff()" class="text-xs bg-blue-600 px-3 py-1.5 rounded-xl font-bold">+ Добавить</button>
              </div>
              ${staff.map((emp, i) => {
                const workedHours = staffHours[emp.id] || 0;
                const maxMonthly = emp.weeklyLimit * 4;
                const isOverLimit = workedHours > maxMonthly;
                return `
                  <div class="bg-slate-900/60 border ${isOverLimit ? "border-red-500/50" : "border-slate-800"} rounded-3xl p-3.5 space-y-3">
                    <div class="flex gap-2">
                      <input type="text" value="${emp.name}" onchange="updateStaff(${i}, 'name', this.value)" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm font-semibold"/>
                      <button onclick="removeStaff(${i})" class="w-9 h-9 bg-red-500/10 text-red-400 rounded-xl font-bold">✕</button>
                    </div>
                    <div class="bg-slate-950 p-2.5 rounded-2xl flex justify-between items-center text-xs">
                      <div>
                        <span class="text-[10px] text-slate-400">Отработано в месяце:</span>
                        <b class="${isOverLimit ? "text-red-400" : "text-slate-200"}">${workedHours}ч / ${maxMonthly}ч</b>
                      </div>
                      <span class="text-[10px] font-bold ${isOverLimit ? "text-red-400 bg-red-500/10 px-2 py-1 rounded" : "text-emerald-400"}">
                        ${isOverLimit ? `Превышение на ${workedHours - maxMonthly}ч` : "Норма"}
                      </span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-xs">
                      <div class="bg-slate-950 p-2 rounded-xl">
                        <span class="text-[10px] text-slate-400">Лимит (ч/нед)</span>
                        <input type="number" value="${emp.weeklyLimit}" onchange="updateStaff(${i}, 'weeklyLimit', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded p-1 mt-1 text-center font-bold"/>
                      </div>
                      <div class="bg-slate-950 p-2 rounded-xl">
                        <span class="text-[10px] text-slate-400">Ставка (€/ч)</span>
                        <input type="number" value="${emp.hourlyRate}" onchange="updateStaff(${i}, 'hourlyRate', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded p-1 mt-1 text-center font-bold text-emerald-400"/>
                      </div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </main>
        `;
      } else if (activeTab === "auto") {
        content += `
          <main class="space-y-4 text-center py-6">
            <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 space-y-4">
              <div class="text-3xl">⚡</div>
              <h3 class="font-bold text-base">Умный ИИ Автогенератор</h3>
              <p class="text-xs text-slate-400 text-left bg-slate-950 p-3 rounded-2xl">
                • <b>Максимум 8 дней подряд:</b> Контроль непрерывной работы.<br/>
                • <b>Циклы отдыха:</b> Авто-распределение с учетом отдыха (7/2 и 8/4).
              </p>
              <button onclick="autoScheduleWithRestRules()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-3.5 rounded-2xl font-bold text-sm">
                Заполнить график с учетом отдыха
              </button>
            </div>
          </main>
        `;
      }

      if (selectedDateStr) {
        const dayObj = shifts[selectedDateStr] || { morning: [], evening: [] };
        const workingIds = [...(dayObj.morning || []), ...(dayObj.evening || [])];
        const offStaff = staff.filter(s => !workingIds.includes(s.id));

        content += `
          <div class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-end justify-center z-50">
            <div class="bg-slate-900 border-t border-slate-800 w-full max-w-md rounded-t-[32px] p-5 space-y-4 animate-slide-up max-h-[85vh] overflow-y-auto">
              <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base">Смены на ${selectedDateStr}</h3>
                <button onclick="selectedDateStr = null; render();" class="w-8 h-8 bg-slate-800 rounded-full font-bold">✕</button>
              </div>
              <div class="bg-slate-950 p-3 rounded-2xl text-xs">
                <b>☕ Выходные (${offStaff.length}):</b> ${offStaff.length ? offStaff.map(s => s.name).join(", ") : "Все работают"}
              </div>
              ${["morning", "evening"].map(sType => `
                <div class="space-y-2">
                  <div class="text-xs font-bold text-slate-400 uppercase">${sType === "morning" ? "Утро" : "Вечер"}</div>
                  <div class="grid grid-cols-2 gap-2">
                    ${staff.map(s => {
                      const isAssigned = (dayObj[sType] || []).includes(s.id);
                      return `
                        <button onclick="toggleShift('${selectedDateStr}', '${sType}', '${s.id}')" class="p-2.5 rounded-2xl text-xs flex justify-between border ${isAssigned ? "bg-blue-600/20 border-blue-500 text-blue-200" : "bg-slate-950 border-slate-800 text-slate-400"}">
                          <span>${s.name}</span><b>${isAssigned ? "✓" : ""}</b>
                        </button>
                      `;
                    }).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      content += `
        <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-950/90 backdrop-blur border-t border-slate-800 px-6 py-3 flex justify-around items-center z-40 pb-7">
          <button onclick="activeTab = 'calendar'; render();" class="text-xs font-bold ${activeTab === "calendar" ? "text-blue-400" : "text-slate-500"}">📅 Календарь</button>
          <button onclick="activeTab = 'staff'; render();" class="text-xs font-bold ${activeTab === "staff" ? "text-blue-400" : "text-slate-500"}">👥 Персонал</button>
          <button onclick="activeTab = 'auto'; render();" class="text-xs font-bold ${activeTab === "auto" ? "text-blue-400" : "text-slate-500"}">⚡ Авто-ИИ</button>
        </nav>
      `;

      app.innerHTML = content;
    }

    function changeMonth(delta) {
      currentDate = new Date(currentDate.getFullYear(), currentDate.getMonth() + delta, 1);
      render();
    }
    function toggleOffDutyGrid() { showOffDutyOnGrid = !showOffDutyOnGrid; render(); }
    function selectDate(dateStr) { selectedDateStr = dateStr; render(); }
    function toggleShift(dateStr, sType, empId) {
      if (!shifts[dateStr]) shifts[dateStr] = { morning: [], evening: [] };
      const list = shifts[dateStr][sType] || [];
      shifts[dateStr][sType] = list.includes(empId) ? list.filter(id => id !== empId) : [...list, empId];
      render();
    }
    function updateReq(type, val) { requirements[type] = parseInt(val) || 0; render(); }
    function addStaff() { staff.push({ id: Date.now().toString(), name: "Новый сотрудник", weeklyLimit: 40, hourlyRate: 15 }); render(); }
    function updateStaff(i, field, val) { staff[i][field] = field === "name" ? val : parseFloat(val) || 0; render(); }
    function removeStaff(i) { staff.splice(i, 1); render(); }

    function autoScheduleWithRestRules() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const daysCount = new Date(year, month + 1, 0).getDate();
      
      const newShifts = {};
      const consecutiveWorkedDays = {};
      const totalHoursWorked = {};
      const forceRestUntil = {};

      staff.forEach(s => {
        consecutiveWorkedDays[s.id] = 0;
        totalHoursWorked[s.id] = 0;
        forceRestUntil[s.id] = 0;
      });

      for (let day = 1; day <= daysCount; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        newShifts[dateStr] = { morning: [], evening: [] };

        const assignToShift = (shiftType, reqCount) => {
          for (let r = 0; r < reqCount; r++) {
            const candidate = staff.find(emp => {
              const maxMonthly = emp.weeklyLimit * 4;
              const alreadyAssigned = newShifts[dateStr].morning.includes(emp.id) || newShifts[dateStr].evening.includes(emp.id);
              return !alreadyAssigned && day >= forceRestUntil[emp.id] && consecutiveWorkedDays[emp.id] < 8 && (totalHoursWorked[emp.id] + 8) <= maxMonthly;
            });

            if (candidate) {
              newShifts[dateStr][shiftType].push(candidate.id);
              consecutiveWorkedDays[candidate.id] += 1;
              totalHoursWorked[candidate.id] += 8;

              if (candidate.weeklyLimit >= 40) {
                if (consecutiveWorkedDays[candidate.id] === 7) {
                  forceRestUntil[candidate.id] = day + 3;
                  consecutiveWorkedDays[candidate.id] = 0;
                } else if (consecutiveWorkedDays[candidate.id] === 8) {
                  forceRestUntil[candidate.id] = day + 5;
                  consecutiveWorkedDays[candidate.id] = 0;
                }
              }
            }
          }
        };

        assignToShift("morning", requirements.morning || 0);
        assignToShift("evening", requirements.evening || 0);

        staff.forEach(emp => {
          if (!newShifts[dateStr].morning.includes(emp.id) && !newShifts[dateStr].evening.includes(emp.id)) {
            consecutiveWorkedDays[emp.id] = 0;
          }
        });
      }

      shifts = newShifts;
      activeTab = "calendar";
      render();
    }

    render();
  </script>
</body>
</html>' style="width: 100%; height: 680px; border: none; border-radius: 24px; background: #020617;"></iframe>
  </components>
</xml>
